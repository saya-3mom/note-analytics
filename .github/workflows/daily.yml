name: Daily note analytics
# scheduled workflow resync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

jobs:
  observe:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run note observation
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
          NOTE_CLIENT_CODE: ${{ secrets.NOTE_CLIENT_CODE }}
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles.csv observations.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update note observations"
            git push
          fi