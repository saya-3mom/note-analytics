<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noteAnalytics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <div class="label">noteAnalytics</div>
    <h1>noteの成長を見える化</h1>
  </div>
  <div id="updated">読み込み中…</div>
</header>

<main>
  <section class="summary">
    <div><span>記事数</span><strong id="count">-</strong></div>
    <div><span>総ビュー</span><strong id="views">-</strong></div>
    <div><span>前回からの増加</span><strong id="diff">-</strong></div>
    <div><span>平均スキ率</span><strong id="rate">-</strong></div>
  </section>

  <section class="card">
    <h2>記事一覧</h2>
    <p class="sub">最新の観測値と、ひとつ前の観測からの増加</p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>管理ID</th><th>タイトル</th><th>ビュー</th>
          <th>前回比</th><th>スキ</th><th>スキ率</th><th>コメント</th>
        </tr></thead>
        <tbody id="table"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>ビュー増加ランキング</h2>
    <p class="sub">前回観測から増えたビュー数</p>
    <div id="ranking"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
